<section class="dashboard-grid">
	<app-work-orders-widget
		class="dashboard-card dashboard-card-wide"
		title="This Week"
		[weekOffset]="0">
	</app-work-orders-widget>

	<app-work-orders-widget
		class="dashboard-card dashboard-card-wide"
		title="Next Week"
		[weekOffset]="1">
	</app-work-orders-widget>

	<app-low-stock-widget
		class="dashboard-card"
		title="Low Ingredients"
		[is_manufactured]="false"
		[is_saleable]="false">
	</app-low-stock-widget>

	<app-low-stock-widget
		class="dashboard-card"
		title="Low Products"
		[is_manufactured]="true"
		[is_saleable]="true">
	</app-low-stock-widget>
</section>
