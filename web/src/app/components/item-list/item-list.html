<section *peaLoading="loading()">
    <h3>Items</h3>

    <div class="actions">
        <button class="button primary" routerLink="/items/new">New Item</button>
    </div>

    <table class="pea-table">
        <thead>
            <tr>
                <th>
                    <button type="button" class="sort-button" (click)="sortBy('sku')">
                        SKU <span class="sort-indicator">{{ sortLabel('sku') }}</span>
                    </button>
                </th>
                <th>
                    <button type="button" class="sort-button" (click)="sortBy('category_name')">
                        Category <span class="sort-indicator">{{ sortLabel('category_name') }}</span>
                    </button>
                </th>
                <th>
                    <button type="button" class="sort-button" (click)="sortBy('name')">
                        Name <span class="sort-indicator">{{ sortLabel('name') }}</span>
                    </button>
                </th>
                <th align="right">
                    <button type="button" class="sort-button sort-button-right" (click)="sortBy('current_stock')">
                        Qty <span class="sort-indicator">{{ sortLabel('current_stock') }}</span>
                    </button>
                </th>
                <th align="right">
                    <button type="button" class="sort-button sort-button-right" (click)="sortBy('cost_per_unit')">
                        Cost <span class="sort-indicator">{{ sortLabel('cost_per_unit') }}</span>
                    </button>
                </th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (item of items(); track item.id) {
            <tr>
                <td>{{ item.sku }}</td>
                <td>{{ item.category_name }}</td>
                <td>{{ item.name }}</td>
                <td align="right">{{ item.current_stock | number:'1.0-2' }}</td>
                <td align="right"><span>£</span> {{ item.cost_per_unit | number:'1.2-2' }}</td>
                <td align="right">
                    <button class="button" [routerLink]="['/items', item.id]">Edit</button>
                </td>
            </tr>
            }
        </tbody>
    </table>

    <div class="actions">
        <button class="button primary" routerLink="/items/new">New Item</button>
    </div>
</section>
