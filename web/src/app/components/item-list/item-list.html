<section *peaLoading="loading()">
    <h3>Items</h3>

    <div class="actions">
        @if(permissions.hasAny(['admin'])()) {
        <button class="button primary" routerLink="/items/new">New Item</button>
        }
    </div>

    <div class="form inline">

        <div class="field search">
            <input type="text" placeholder="Search SKU or name..."
                [value]="searchTerm()"
                (input)="onSearchTermChange($any($event.target).value)">
        </div>

        <div class="field">
            <select (change)="onCategoryFilterChange($any($event.target).value)">
                <option value="">All categories</option>
                @for (category of categories(); track category.id) {
                <option [value]="category.name" [selected]="category.name === categoryFilter()">{{ category.name }}</option>
                }
            </select>
        </div>

        <div class="field">
            <select (change)="onManufacturedFilterChange($any($event.target).value)">
                <option value="">All</option>
                <option value="true">Manufactured</option>
                <option value="false">Not manufactured</option>
            </select>
        </div>
        <div class="field">
            <select (change)="onSaleableFilterChange($any($event.target).value)">
                <option value="">All</option>
                <option value="true">Saleable</option>
                <option value="false">Not saleable</option>
            </select>
        </div>
</div>

    <table class="pea-table">
        <thead>
            <tr>
                <th>
                    <button type="button" class="sort-button" (click)="sortBy('sku')">
                        SKU <span class="sort-indicator">{{ sortLabel('sku') }}</span>
                    </button>
                </th>
                <th>
                    <button type="button" class="sort-button" (click)="sortBy('category_name')">
                        Category <span class="sort-indicator">{{ sortLabel('category_name') }}</span>
                    </button>
                </th>
                <th>
                    <button type="button" class="sort-button" (click)="sortBy('name')">
                        Name <span class="sort-indicator">{{ sortLabel('name') }}</span>
                    </button>
                </th>
                <th align="right">
                    <button type="button" class="sort-button sort-button-right" (click)="sortBy('batch_count')">
                        Batches <span class="sort-indicator">{{ sortLabel('batch_count') }}</span>
                    </button>
                </th>
                <th align="right">
                    <button type="button" class="sort-button sort-button-right" (click)="sortBy('current_stock')">
                        Qty <span class="sort-indicator">{{ sortLabel('current_stock') }}</span>
                    </button>
                </th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (item of items(); track item.id) {
            <tr>
                <td>{{ item.sku }}</td>
                <td>{{ item.category_name }}</td>
                <td>{{ item.name }}</td>
                <td align="right">{{ item.batch_count }}</td>
                <td align="right">{{ item.current_stock | number:'1.0-2' }}</td>
                <td align="right">
                    @if(permissions.hasAny(['admin'])()) {
                    <button class="button" [routerLink]="['/items', item.id]">Edit</button>
                    }
                </td>
            </tr>
            }
        </tbody>
    </table>
</section>
